name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: chmod +x mvnw

      - run: ./mvnw -B verify

      - name: Resume de la couverture
        run: |
          awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Couverture des instructions : %.1f%%\n", c*100/(m+c)}' target/site/jacoco/jacoco.csv | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco

  docker:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Construction de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
            ${{ steps.nom.outputs.image }}:latest

      - name: Test de demarrage
        run: |
          docker run -d --name test-demarrage -p 8080:8080 ${{ steps.nom.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application demarree : health UP"
              exit 0
            fi
            sleep 3
          done
          echo "L'application n'a pas demarre"
          docker logs test-demarrage
          exit 1

      - name: Publication
        run: |
          docker push ${{ steps.nom.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.nom.outputs.image }}:latest
