name: CI 
 
on: [push, pull_request] 
 
jobs: 
  build-test: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
 
      - uses: actions/setup-java@v4 
        with: 
          distribution: temurin 
          java-version: 21 
          cache: maven 
 
      - run: chmod +x mvnw 
 
      - run: ./mvnw -B verify 
 
      - name: Resume de la couverture
        run: |
          awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Couverture des instructions : %.1f%%\n", c*100/(m+c)}' target/site/jacoco/jacoco.csv | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco
      